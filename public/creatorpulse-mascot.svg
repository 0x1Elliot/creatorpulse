<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CreatorPulse anime creator mascot</title>
  <desc id="desc">An original anime-inspired creator with windswept spiky hair, a camera and a bright, confident expression.</desc>
  <defs>
