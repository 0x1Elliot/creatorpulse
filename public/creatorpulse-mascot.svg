    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#176f68"/><stop offset="1" stop-color="#134f55"/></linearGradient>
    <clipPath id="portrait"><circle cx="256" cy="256" r="238"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="247" fill="#172a2d"/>
